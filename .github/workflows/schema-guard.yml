name: Schema guard

on:
  pull_request:

# Definitions are authored under sources/ in the newest schema and published as
# one rendered tree per schema. Two things have to hold on every pull request:
# the published trees are what the sources render to, and the oldest of them
# stays readable by the binaries that fetch it.
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Render every schema
        run: python3 .github/scripts/render_schema.py

      - name: The published trees must match the sources
        run: |
          if ! git diff --quiet; then
            echo "The published trees are stale. Run .github/scripts/render_schema.py and commit the result."
            git diff --stat
            exit 1
          fi

  schema-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Extract the published tree
        run: |
          mkdir -p "$RUNNER_TEMP/published"
          git archive "origin/${{ github.base_ref }}" | tar -x -C "$RUNNER_TEMP/published"

      - name: Compare this pull request against it
        run: python3 .github/scripts/schema_guard.py "$RUNNER_TEMP/published" .
