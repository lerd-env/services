name: mercure
image: docker.io/dunglas/mercure:v0.24.2
update_strategy: minor
description: "Mercure hub for server-sent events, the Symfony realtime transport"
ports:
  - "3001:80"
environment:
  SERVER_NAME: ":80"
  MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
  MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
# The hub's own Caddyfile with three subdirectives added: anonymous subscribers,
# open CORS, and the debug UI. They are newline separated, and the image's
# MERCURE_EXTRA_DIRECTIVES variable cannot carry a newline. No transport_url:
# 0.20 dropped the Bolt transport, so the hub keeps its history in memory and
# there is nothing to persist between restarts.
files:
  - target: /etc/caddy/Caddyfile
    content: |
      {
      	{$GLOBAL_OPTIONS}
      }

      {$CADDY_EXTRA_CONFIG}

      {$SERVER_NAME:localhost} {
      	encode zstd gzip

      	mercure {
      		publisher_jwt {env.MERCURE_PUBLISHER_JWT_KEY}
      		subscriber_jwt {env.MERCURE_SUBSCRIBER_JWT_KEY}
      		anonymous
      		cors_origins *
      		demo
      	}

      	respond /healthz 200
      	respond "Mercure hub, run by lerd" 200
      }
dashboard: http://localhost:3001/.well-known/mercure/ui/
# The hub's UI sits at a fixed path under /.well-known and has no setting for a
# mount path, so the proxy strips its own prefix rather than forwarding it, which
# also drops the X-Frame-Options: deny the UI answers with. Its assets are all
# relative, which is what makes that work.
dashboard_proxy_strip: true
env_vars:
  - MERCURE_URL=http://lerd-mercure/.well-known/mercure
  - MERCURE_PUBLIC_URL=http://localhost:3001/.well-known/mercure
  - MERCURE_JWT_SECRET=!ChangeThisMercureHubJWTSecretKey!
category: messaging
icon: broadcast
color: "#2ab3d7"
