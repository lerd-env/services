name: mongo-express
image: docker.io/library/mongo-express:latest
description: Mongo Express web UI for the lerd MongoDB service
ports:
  - "8082:8081"
environment:
  ME_CONFIG_MONGODB_URL: mongodb://root:lerd@lerd-mongo:27017/?authSource=admin
  ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
  ME_CONFIG_BASICAUTH: "false"
depends_on:
  - mongo
dashboard: http://localhost:8082
# The express-session cookie is dropped when the dashboard is framed from
# another origin, so lerd-ui serves it same-origin under /_svc/mongo-express/.
dashboard_external: true
category: admin
icon: leaf
admin_for:
  - mongo
