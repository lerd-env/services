name: rabbitmq
label: "RabbitMQ"
family: rabbitmq
default_version: "3"
versions:
  - tag: "3"
    label: "3 (default)"
    image: docker.io/library/rabbitmq:3-management-alpine
    canonical: true
    host_port: 5672
  - tag: "4"
    label: "4"
    image: docker.io/library/rabbitmq:4-management-alpine
    host_port: 5672
description: RabbitMQ message broker with management UI
ports:
  - "{{host_port}}:5672"
  - "15672:15672"
environment:
  RABBITMQ_DEFAULT_USER: root
  RABBITMQ_DEFAULT_PASS: lerd
data_dir: /var/lib/rabbitmq
env_vars:
  - RABBITMQ_HOST=lerd-{{name}}
  - RABBITMQ_PORT=5672
  - RABBITMQ_USER=root
  - RABBITMQ_PASSWORD=lerd
  - RABBITMQ_VHOST=/
env_detect:
  key: RABBITMQ_HOST
dashboard: http://localhost:15672
# Cowboy session cookie has no SameSite override, so iframe login fails.
# Force the dashboard to open in a new tab to keep auth working.
dashboard_external: true
connection_url: amqp://root:lerd@127.0.0.1:{{host_port}}/
files:
  - target: /etc/rabbitmq/conf.d/10-lerd-path-prefix.conf
    content: |
      management.path_prefix = /_svc/rabbitmq
category: messaging
icon: queue
color: "#ff6600"
