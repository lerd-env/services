name: adminer
image: docker.io/library/adminer:6
update_strategy: rolling
description: Adminer web UI for every database lerd runs
ports:
- 8081:8080
dynamic_env:
  ADMINER_MYSQL_HOSTS: discover_family:mysql,mariadb
  ADMINER_PGSQL_HOSTS: discover_family:postgres
files:
- target: /var/www/html/index.php
  content: "<?php\nnamespace docker {\n\tfunction adminer_object() {\n\t\trequire_once\
    \ './plugins/login-servers.php';\n\t\tclass LerdServers extends \\AdminerLoginServers\
    \ {\n\t\t\tfunction credentials() {\n\t\t\t\t$s = $this->servers[\\Adminer\\SERVER];\n\
    \t\t\t\treturn array($s['server'], $s['username'], $s['password']);\n\t\t\t}\n\
    \t\t\tfunction login($login, $password) { return true; }\n\t\t}\n\t\treturn new\
    \ \\Adminer\\Plugins(array(new LerdServers(\\lerd_servers())));\n\t}\n}\nnamespace\
    \ {\n\tfunction lerd_servers() {\n\t\tstatic $out = null;\n\t\tif ($out !== null)\
    \ { return $out; }\n\t\t$families = array(\n\t\t\t'ADMINER_MYSQL_HOSTS'      =>\
    \ array('server',     'root',     'lerd'),\n\t\t\t'ADMINER_PGSQL_HOSTS'      =>\
    \ array('pgsql',      'postgres', 'lerd'),\n\t\t);\n\t\t$out = array();\n\t\t\
    foreach ($families as $env => $spec) {\n\t\t\tforeach (array_filter(explode(',',\
    \ (string) getenv($env))) as $host) {\n\t\t\t\t$out[$host] = array('server' =>\
    \ $host, 'driver' => $spec[0], 'username' => $spec[1], 'password' => $spec[2]);\n\
    \t\t\t}\n\t\t}\n\t\tif (!$out) {\n\t\t\t$out['lerd-mysql'] = array('server' =>\
    \ 'lerd-mysql', 'driver' => 'server', 'username' => 'root', 'password' => 'lerd');\n\
    \t\t}\n\t\treturn $out;\n\t}\n\n\tfunction lerd_query_key(array $s) {\n\t\treturn\
    \ $s['driver'] === 'server' ? 'server' : $s['driver'];\n\t}\n\n\t// Which server\
    \ actually holds this database. The dashboard deep-links a\n\t// database by name\
    \ alone, so without this a Postgres database opens against\n\t// MySQL and Adminer\
    \ answers \"Invalid database\".\n\tfunction lerd_server_with_db($db) {\n\t\tforeach\
    \ (lerd_servers() as $host => $s) {\n\t\t\ttry {\n\t\t\t\tif ($s['driver'] ===\
    \ 'server' && extension_loaded('mysqli')) {\n\t\t\t\t\t$c = @new mysqli($host,\
    \ $s['username'], $s['password']);\n\t\t\t\t\tif ($c->connect_errno) { continue;\
    \ }\n\t\t\t\t\t$q = $c->query(\"SHOW DATABASES LIKE '\" . $c->real_escape_string($db)\
    \ . \"'\");\n\t\t\t\t\t$hit = $q && $q->num_rows > 0;\n\t\t\t\t\t$c->close();\n\
    \t\t\t\t\tif ($hit) { return $host; }\n\t\t\t\t} elseif ($s['driver'] === 'pgsql'\
    \ && extension_loaded('pdo_pgsql')) {\n\t\t\t\t\t$p = new PDO(\"pgsql:host=$host;dbname=postgres\"\
    , $s['username'], $s['password'], array(PDO::ATTR_TIMEOUT => 2));\n\t\t\t\t\t\
    $st = $p->prepare('SELECT 1 FROM pg_database WHERE datname = ?');\n\t\t\t\t\t\
    $st->execute(array($db));\n\t\t\t\t\tif ($st->fetchColumn()) { return $host; }\n\
    \t\t\t\t}\n\t\t\t} catch (\\Throwable $e) {\n\t\t\t\t// A server that is down\
    \ must not stop the search.\n\t\t\t}\n\t\t}\n\t\treturn null;\n\t}\n\n\t// The\
    \ dashboard proxy forwards its own /_svc/<name>/ prefix, and Adminer's own\n\t\
    // assets are query strings rather than paths, so they survive it. A design\n\t\
    // stylesheet is the exception: Adminer links it as a plain file name, which\n\
    \t// arrives here under the prefix, misses on disk and falls through to this\n\
    \t// script. Serve it rather than treat it as a page to redirect.\n\t$asset =\
    \ basename(parse_url($_SERVER['REQUEST_URI'] ?? '', PHP_URL_PATH) ?: '');\n\t\
    if (preg_match('~^[\\\\w.-]+\\\\.(css|js|png|gif|ico|svg|woff2?)$~', $asset) &&\
    \ is_file(__DIR__ . '/' . $asset)) {\n\t\t$types = array('css' => 'text/css',\
    \ 'js' => 'application/javascript', 'png' => 'image/png',\n\t\t\t'gif' => 'image/gif',\
    \ 'ico' => 'image/x-icon', 'svg' => 'image/svg+xml',\n\t\t\t'woff' => 'font/woff',\
    \ 'woff2' => 'font/woff2');\n\t\t$ext = strtolower(pathinfo($asset, PATHINFO_EXTENSION));\n\
    \t\theader('Content-Type: ' . ($types[$ext] ?? 'application/octet-stream'));\n\
    \t\treadfile(__DIR__ . '/' . $asset);\n\t\texit;\n\t}\n\n\t$servers = lerd_servers();\n\
    \t// Seeded and closed before adminer.php is included, with the cache limiter\n\
    \t// off, so its own session_start sends no headers after ours have gone out.\n\
    \tini_set('session.cache_limiter', '');\n\tob_start();\n\tsession_name('adminer_sid');\n\
    \tsession_start();\n\tforeach ($servers as $host => $s) {\n\t\tif (!isset($_SESSION['pwds'][$s['driver']][$host][$s['username']]))\
    \ {\n\t\t\t$_SESSION['pwds'][$s['driver']][$host][$s['username']] = $s['password'];\n\
    \t\t\t$_SESSION['db'][$s['driver']][$host][$s['username']] = array();\n\t\t}\n\
    \t}\n\tsession_write_close();\n\tob_end_clean();\n\n\t// Which server this request\
    \ is for. A request that already names one is left\n\t// alone; anything else\
    \ is answered with a redirect to the canonical URL rather\n\t// than by rewriting\
    \ the request in place, because the versions disagree about\n\t// whether they\
    \ build their own links from $_GET or from the raw query string,\n\t// and a rewrite\
    \ that one of them ignores turns into a redirect loop.\n\t$named = false;\n\t\
    foreach ($servers as $host => $s) {\n\t\tif (isset($_GET[lerd_query_key($s)]))\
    \ { $named = true; break; }\n\t}\n\t// An asset request carries file=; it needs\
    \ no server and redirecting it only\n\t// costs a round trip before Adminer serves\
    \ the same bytes.\n\tif (!$named && !isset($_GET['file'])) {\n\t\t$pick = null;\n\
    \t\t// lerd_server is how the dashboard says which engine it opened this for,\n\
    \t\t// without having to know the driver or the credentials that go with it.\n\
    \t\tif (isset($_GET['lerd_server']) && isset($servers[$_GET['lerd_server']]))\
    \ {\n\t\t\t$pick = $_GET['lerd_server'];\n\t\t} elseif (isset($_GET['db']) &&\
    \ $_GET['db'] !== '') {\n\t\t\t$pick = lerd_server_with_db($_GET['db']);\n\t\t\
    }\n\t\tif ($pick === null) { $pick = key($servers); }\n\t\t$s = $servers[$pick];\n\
    \t\t$q = $_GET;\n\t\tunset($q['lerd_server']);\n\t\t$q[lerd_query_key($s)] = $pick;\n\
    \t\t$q['username'] = $s['username'];\n\t\t// A Postgres database is only half\
    \ an address; without a schema the hub\n\t\t// of the URL is incomplete and 6\
    \ bounces it back rather than opening it.\n\t\tif ($s['driver'] === 'pgsql' &&\
    \ !empty($q['db']) && !isset($q['ns'])) {\n\t\t\t$q['ns'] = 'public';\n\t\t}\n\
    \t\theader('Location: ?' . http_build_query($q), true, 302);\n\t\texit;\n\t}\n\
    \n\t// Adminer 5 registers a plugin hook only for methods that exist on its core\n\
    \t// object, and navigation() is a plain function there, so a plugin cannot add\n\
    \t// to the sidebar. The switcher is spliced into the rendered page instead, from\n\
    \t// an output-buffer callback: Adminer exits on most paths, and a callback still\n\
    \t// runs at shutdown where code after the include would not.\n\tfunction lerd_switcher($html)\
    \ {\n\t\t$servers = lerd_servers();\n\t\tif (count($servers) < 2 || strpos($html,\
    \ \"<div id='menu'>\") === false) {\n\t\t\treturn $html;\n\t\t}\n\t\t$links =\
    \ array();\n\t\tforeach ($servers as $host => $s) {\n\t\t\t$key = lerd_query_key($s);\n\
    \t\t\t$label = htmlspecialchars($host);\n\t\t\t$links[] = (isset($_GET[$key])\
    \ && $_GET[$key] === $host)\n\t\t\t\t? \"<b>$label</b>\"\n\t\t\t\t: \"<a href='?\"\
    \ . $key . '=' . urlencode($host) . '&username=' . urlencode($s['username']) .\
    \ \"'>$label</a>\";\n\t\t}\n\t\t$bar = \"<div id='lerd-servers' style='padding:.6em\
    \ .8em;line-height:1.9'>\" . implode('<br>', $links) . \"</div>\";\n\t\t$out =\
    \ preg_replace(\"~(<div id='menu'>)~\", '$1' . $bar, $html, 1);\n\t\treturn $out\
    \ === null ? $html : $out;\n\t}\n\n\tif (isset($_GET['dump']) || isset($_GET['download'])\
    \ || isset($_POST['export'])) {\n\t\trequire './adminer.php';\n\t\treturn;\n\t\
    }\n\tob_start('lerd_switcher');\n\trequire './adminer.php';\n}\n"
- target: /var/www/html/adminer.css
  content: "/* Adminer design lerd */\n/* Adminer themes itself through four variables,\
    \ so matching the dashboard is a\n   matter of setting them rather than restyling\
    \ the page. Only the accent comes\n   from lerd's palette, which the overlay copies\
    \ into this document, so picking\n   another palette repaints the embedded tool\
    \ too. The surfaces are lerd's own\n   light neutrals, which are plain greys and\
    \ not palette driven. */\nhtml {\n\t--bg: #f9fafb;\n\t--fg: #1f2937;\n\t--dim:\
    \ #f3f4f6;\n\t--lit: #e5e7eb;\n}\na, a:visited { color: var(--lerd-accent, #ff2d20);\
    \ }\n"
- target: /var/www/html/adminer-dark.css
  content: "/* Adminer design lerd */\n/* Adminer themes itself through four variables,\
    \ and its own dark sheet then\n   repaints about thirty rules in blues that ignore\
    \ them. The variables carry the\n   surfaces, and the rules below take those blues\
    \ back onto lerd's own greys, so\n   the embedded tool sits on the same palette\
    \ as the panel around it. bg, card\n   and border come from the palette the overlay\
    \ copies in, so changing palette in\n   lerd repaints this too. */\nhtml {\n\t\
    --bg: var(--lerd-bg, #0d0d0d);\n\t--fg: #e5e5e5;\n\t--dim: var(--lerd-card, #161616);\n\
    \t--lit: var(--lerd-border, #262626);\n\t--accent: var(--lerd-accent, #ff2d20);\n\
    }\n\na, a:visited, button.link, #schema div.table a, .js .checkable .checked a\
    \ { color: var(--accent); }\na:link:hover, a:visited:hover, button.link:hover\
    \ { color: var(--lerd-accent-hover, #e02419); }\n\nh1 { border-color: var(--lit);\
    \ color: var(--fg); }\nh2 { border-color: var(--lit); color: var(--fg); background:\
    \ var(--dim); }\n#h1, .version, #version, .plugins .update { color: var(--fg);\
    \ }\n\ntable, td, th, .column, fieldset, #menu, #menu p, #logins, #tables,\n#schema\
    \ .table, #help { border-color: var(--lit); }\nth, code { background: var(--dim);\
    \ }\nthead td, thead th, thead th a, :target { color: var(--fg); }\ntbody tr:hover\
    \ td, tbody tr:hover th,\n#edit-fields tbody tr:hover td, #edit-fields tbody tr:hover\
    \ th { background: var(--lit); }\n.odds tbody tr:nth-child(2n) { background: var(--dim);\
    \ }\n.js .checkable .checked td, .js .checkable .checked th { background: var(--lit);\
    \ color: var(--fg); }\n.js .checkable .checked:hover td, .js .checkable .checked:hover\
    \ th { background: var(--lit); }\n#menu .active { color: var(--accent); }\n.icon\
    \ { background-color: var(--dim); }\n.icon:hover { background-color: var(--accent);\
    \ }\n\n/* The syntax highlighter has its own set, keyed to the same surfaces.\
    \ */\n.jush { --bg-color: var(--dim); --border-color: var(--lit); }\n"
dashboard: http://localhost:8081
dashboard_external: true
category: admin
icon: database
color: '#34567c'
admin_for:
- mysql
- mariadb
- postgres
- postgres-pgvector
- postgres-timescaledb
