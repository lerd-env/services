name: adminer
image: docker.io/library/adminer:6
update_strategy: rolling
description: "Adminer web UI for every database lerd runs"
ports:
  - "8081:8080"
dynamic_env:
  # Every running member of each family, comma joined, so the mount below can
  # authenticate all of them rather than the one the preset happens to name.
  ADMINER_MYSQL_HOSTS: discover_family:mysql,mariadb
  ADMINER_PGSQL_HOSTS: discover_family:postgres
  ADMINER_CLICKHOUSE_HOSTS: discover_family:clickhouse
# Adminer's own index.php only prefills the server field, which leaves a login
# form in front of databases lerd already holds the credentials for. This one
# seeds a session per running server, resolves a database named without a server
# to the engine that actually holds it, and splices in a server switcher.
files:
  - target: /var/www/html/index.php
    content: |
      <?php
      namespace docker {
      	function adminer_object() {
      		require_once './plugins/login-servers.php';
      		class LerdServers extends \AdminerLoginServers {
      			function credentials() {
      				$s = $this->servers[\Adminer\SERVER];
      				return array($s['server'], $s['username'], $s['password']);
      			}
      			function login($login, $password) { return true; }
      		}
      		return new \Adminer\Plugins(array(new LerdServers(\lerd_servers())));
      	}
      }
      namespace {
      	function lerd_servers() {
      		static $out = null;
      		if ($out !== null) { return $out; }
      		$families = array(
      			'ADMINER_MYSQL_HOSTS'      => array('server',     'root',     'lerd'),
      			'ADMINER_PGSQL_HOSTS'      => array('pgsql',      'postgres', 'lerd'),
      			'ADMINER_CLICKHOUSE_HOSTS' => array('clickhouse', 'lerd',     'lerd'),
      		);
      		$out = array();
      		foreach ($families as $env => $spec) {
      			foreach (array_filter(explode(',', (string) getenv($env))) as $host) {
      				$out[$host] = array('server' => $host, 'driver' => $spec[0], 'username' => $spec[1], 'password' => $spec[2]);
      			}
      		}
      		if (!$out) {
      			$out['lerd-mysql'] = array('server' => 'lerd-mysql', 'driver' => 'server', 'username' => 'root', 'password' => 'lerd');
      		}
      		return $out;
      	}

      	function lerd_query_key(array $s) {
      		return $s['driver'] === 'server' ? 'server' : $s['driver'];
      	}

      	// Which server actually holds this database. The dashboard deep-links a
      	// database by name alone, so without this a Postgres database opens against
      	// MySQL and Adminer answers "Invalid database".
      	function lerd_server_with_db($db) {
      		foreach (lerd_servers() as $host => $s) {
      			try {
      				if ($s['driver'] === 'server' && extension_loaded('mysqli')) {
      					$c = @new mysqli($host, $s['username'], $s['password']);
      					if ($c->connect_errno) { continue; }
      					$q = $c->query("SHOW DATABASES LIKE '" . $c->real_escape_string($db) . "'");
      					$hit = $q && $q->num_rows > 0;
      					$c->close();
      					if ($hit) { return $host; }
      				} elseif ($s['driver'] === 'pgsql' && extension_loaded('pdo_pgsql')) {
      					$p = new PDO("pgsql:host=$host;dbname=postgres", $s['username'], $s['password'], array(PDO::ATTR_TIMEOUT => 2));
      					$st = $p->prepare('SELECT 1 FROM pg_database WHERE datname = ?');
      					$st->execute(array($db));
      					if ($st->fetchColumn()) { return $host; }
      				}
      			} catch (\Throwable $e) {
      				// A server that is down must not stop the search.
      			}
      		}
      		return null;
      	}

      	$servers = lerd_servers();
      	// Seeded and closed before adminer.php is included, with the cache limiter
      	// off, so its own session_start sends no headers after ours have gone out.
      	ini_set('session.cache_limiter', '');
      	ob_start();
      	session_name('adminer_sid');
      	session_start();
      	foreach ($servers as $host => $s) {
      		if (!isset($_SESSION['pwds'][$s['driver']][$host][$s['username']])) {
      			$_SESSION['pwds'][$s['driver']][$host][$s['username']] = $s['password'];
      			$_SESSION['db'][$s['driver']][$host][$s['username']] = array();
      		}
      	}
      	session_write_close();
      	ob_end_clean();

      	// Which server this request is for. A request that already names one is left
      	// alone; anything else is answered with a redirect to the canonical URL rather
      	// than by rewriting the request in place, because the versions disagree about
      	// whether they build their own links from $_GET or from the raw query string,
      	// and a rewrite that one of them ignores turns into a redirect loop.
      	$named = false;
      	foreach ($servers as $host => $s) {
      		if (isset($_GET[lerd_query_key($s)])) { $named = true; break; }
      	}
      	if (!$named) {
      		$pick = null;
      		// lerd_server is how the dashboard says which engine it opened this for,
      		// without having to know the driver or the credentials that go with it.
      		if (isset($_GET['lerd_server']) && isset($servers[$_GET['lerd_server']])) {
      			$pick = $_GET['lerd_server'];
      		} elseif (isset($_GET['db']) && $_GET['db'] !== '') {
      			$pick = lerd_server_with_db($_GET['db']);
      		}
      		if ($pick === null) { $pick = key($servers); }
      		$s = $servers[$pick];
      		$q = $_GET;
      		unset($q['lerd_server']);
      		$q[lerd_query_key($s)] = $pick;
      		$q['username'] = $s['username'];
      		// A Postgres database is only half an address; without a schema the hub
      		// of the URL is incomplete and 6 bounces it back rather than opening it.
      		if ($s['driver'] === 'pgsql' && !empty($q['db']) && !isset($q['ns'])) {
      			$q['ns'] = 'public';
      		}
      		header('Location: ?' . http_build_query($q), true, 302);
      		exit;
      	}

      	// Adminer 5 registers a plugin hook only for methods that exist on its core
      	// object, and navigation() is a plain function there, so a plugin cannot add
      	// to the sidebar. The switcher is spliced into the rendered page instead, from
      	// an output-buffer callback: Adminer exits on most paths, and a callback still
      	// runs at shutdown where code after the include would not.
      	function lerd_switcher($html) {
      		$servers = lerd_servers();
      		if (count($servers) < 2 || strpos($html, "<div id='menu'>") === false) {
      			return $html;
      		}
      		$links = array();
      		foreach ($servers as $host => $s) {
      			$key = lerd_query_key($s);
      			$label = htmlspecialchars($host);
      			$links[] = (isset($_GET[$key]) && $_GET[$key] === $host)
      				? "<b>$label</b>"
      				: "<a href='?" . $key . '=' . urlencode($host) . '&username=' . urlencode($s['username']) . "'>$label</a>";
      		}
      		$bar = "<div id='lerd-servers' style='padding:.6em .8em;line-height:1.9'>" . implode('<br>', $links) . "</div>";
      		$out = preg_replace("~(<div id='menu'>)~", '$1' . $bar, $html, 1);
      		return $out === null ? $html : $out;
      	}

      	if (isset($_GET['dump']) || isset($_GET['download']) || isset($_POST['export'])) {
      		require './adminer.php';
      		return;
      	}
      	ob_start('lerd_switcher');
      	require './adminer.php';
      }
dashboard: http://localhost:8081
# Adminer answers X-Frame-Options: deny, so it is served through the same-origin
# proxy, which drops that header. Its own links are query strings rather than
# paths, so it needs no telling about the mount it is served under.
dashboard_external: true
category: admin
icon: database
color: "#34567c"
# admin_for matches the preset a service was installed from, not its family, so
# the Postgres variants have to be named even though discover_family already
# finds them by family and puts them in the server list.
admin_for:
  - mysql
  - mariadb
  - postgres
  - postgres-pgvector
  - postgres-timescaledb
  - clickhouse
# Preferred over the single-engine tools when more than one is installed, and
# suggested ahead of them. It covers every engine lerd runs from one container,
# and lerd's own Databases tab already does the dump and restore that pgAdmin
# and phpMyAdmin are otherwise carried for.
admin_rank: 10
