name: dragonfly
description: Dragonfly in-memory store (Redis-compatible)
family: dragonfly
env_role: redis
image: ghcr.io/dragonflydb/dragonfly:v2.0.2
# Dragonfly speaks the Redis protocol on 6379 inside the container; it is
# published on 6381 so it can coexist with the redis and valkey presets.
ports:
  - "6381:6379"
data_dir: /data
env_vars:
  - REDIS_HOST=lerd-dragonfly
  - REDIS_PORT=6379
  - REDIS_PASSWORD=null
  - CACHE_STORE=redis
  - SESSION_DRIVER=redis
  - QUEUE_CONNECTION=redis
connection_url: redis://127.0.0.1:6381
category: cache
color: "#6d28d9"
icon: bolt
