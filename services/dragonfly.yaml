name: dragonfly
label: Dragonfly
image: ghcr.io/dragonflydb/dragonfly:v2.0.2
description: Dragonfly in-memory store (Redis-compatible)
family: dragonfly
env_role: redis
update_strategy: minor
exec: --proactor_threads=2 --maxmemory=1gb
ports:
- 6381:6379
data_dir: /data
env_vars:
- REDIS_HOST=lerd-dragonfly
- REDIS_PORT=6379
- REDIS_PASSWORD=null
- CACHE_STORE=redis
- SESSION_DRIVER=redis
- QUEUE_CONNECTION=redis
connection_url: redis://127.0.0.1:6381
category: cache
color: '#5a3ee0'
icon: bolt
