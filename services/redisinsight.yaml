name: redisinsight
image: docker.io/redis/redisinsight:latest
description: RedisInsight web UI for every installed lerd Redis and Valkey service
ports:
  - "8085:5540"
environment:
  RI_APP_PORT: "5540"
  # Single-connection fallback for binaries that predate expand_env; a binary
  # that resolves expand_env replaces these with one numbered set per member.
  RI_REDIS_HOST: lerd-redis
  RI_REDIS_PORT: "6379"
  RI_REDIS_ALIAS: lerd-redis
expand_env:
  RI_REDIS_HOST: redis,valkey={host}
  RI_REDIS_PORT: redis,valkey=6379
  RI_REDIS_ALIAS: redis,valkey={name}
depends_on:
  - redis
dashboard: http://localhost:8085
# RedisInsight sets first-run consent cookies the iframe can't carry across
# origins, so lerd-ui proxies it same-origin (see dashboard_external handling).
dashboard_external: true
# RedisInsight ships its theme set to SYSTEM, which means it asks the browser
# which scheme it is in rather than reading a media query, so lerd answers
# with its own mode and the dark design it already has comes up.
dashboard_follows_color_scheme: true
# It remembers a side once its own switcher is used, under a key it namespaces by
# where it is served, so lerd forgets that on the way in and the overlay's theme
# wins. Its switcher still works for as long as the view is open.
dashboard_scheme_key: "{{mount}}_theme"
category: admin
icon: database
admin_for:
  - redis
  - valkey
