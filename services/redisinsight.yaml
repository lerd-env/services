name: redisinsight
image: docker.io/redis/redisinsight:latest
description: RedisInsight web UI for every installed lerd Redis and Valkey service
ports:
  - "8085:5540"
environment:
  RI_APP_PORT: "5540"
# One numbered RI_REDIS_* connection set per running redis/valkey member, so
# the UI opens already wired to every installed engine, not just lerd-redis.
dynamic_env:
  RI_REDIS_HOST: expand_family:redis,valkey={host}
  RI_REDIS_PORT: expand_family:redis,valkey=6379
  RI_REDIS_ALIAS: expand_family:redis,valkey={name}
depends_on:
  - redis
dashboard: http://localhost:8085
# RedisInsight sets first-run consent cookies the iframe can't carry across
# origins, so lerd-ui proxies it same-origin (see dashboard_external handling).
dashboard_external: true
category: admin
icon: database
admin_for:
  - redis
  - valkey
