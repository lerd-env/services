name: redisinsight
image: docker.io/redis/redisinsight:latest
description: RedisInsight web UI for every installed lerd Redis and Valkey service
ports:
  - "8085:5540"
environment:
  RI_APP_PORT: "5540"
  # Single-connection fallback for binaries that predate expand_env; a binary
  # that resolves expand_env replaces these with one numbered set per member.
  RI_REDIS_HOST: lerd-redis
  RI_REDIS_PORT: "6379"
  RI_REDIS_ALIAS: lerd-redis
expand_env:
  RI_REDIS_HOST: redis,valkey={host}
  RI_REDIS_PORT: redis,valkey=6379
  RI_REDIS_ALIAS: redis,valkey={name}
depends_on:
  - redis
dashboard: http://localhost:8085
# RedisInsight sets first-run consent cookies the iframe can't carry across
# origins, so lerd-ui proxies it same-origin (see dashboard_external handling).
dashboard_external: true
category: admin
icon: database
admin_for:
  - redis
  - valkey
