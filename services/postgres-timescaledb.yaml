name: postgres-timescaledb
description: PostgreSQL with TimescaleDB (time-series extension)
family: postgres
default_version: "17"
versions:
  - tag: "17"
    label: "17 (default)"
    image: docker.io/timescale/timescaledb:latest-pg17
    canonical: true
    host_port: 5432
  - tag: "16"
    label: "16"
    image: docker.io/timescale/timescaledb:latest-pg16
    host_port: 5432
ports:
  - "{{host_port}}:5432"
data_dir: /var/lib/postgresql/data
environment:
  POSTGRES_PASSWORD: lerd
  POSTGRES_DB: lerd
  PGDATA: /var/lib/postgresql/data
env_vars:
  - DB_CONNECTION=pgsql
  - DB_HOST=lerd-{{name}}
  - DB_PORT=5432
  - DB_DATABASE=lerd
  - DB_USERNAME=postgres
  - DB_PASSWORD=lerd
connection_url: postgresql://postgres:lerd@127.0.0.1:{{host_port}}/lerd
client_shims:
  - psql
  - pg_dump
  - pg_dumpall
  - pg_restore
site_init:
  exec: psql -U postgres -d {{site}} -c "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE"
category: databases
icon: elephant
# list_databases is kept alongside entities so lerd versions from before the
# entities schema still list the databases.
introspect:
  list_databases: >
    psql -U postgres -tAc
    "SELECT datname || chr(9) || GREATEST(pg_database_size(datname)
    - (SELECT pg_database_size('template1')), 0) FROM pg_database
    WHERE datistemplate = false AND datname <> 'postgres' ORDER BY datname"
  entities:
    - kind: databases
      format: sql
      list: >
        psql -U postgres -tAc
        "SELECT datname || chr(9) || GREATEST(pg_database_size(datname)
        - (SELECT pg_database_size('template1')), 0) FROM pg_database
        WHERE datistemplate = false AND datname <> 'postgres' ORDER BY datname"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        create: psql -U postgres -c 'CREATE DATABASE "{{name}}";'
        drop:
          exec: psql -U postgres -c 'DROP DATABASE IF EXISTS "{{name}}" WITH (FORCE);'
          destructive: true
        export:
          exec: pg_dump -U postgres --clean --if-exists {{name}}
          filename: "{{name}}.sql"
        import: psql -U postgres -d {{name}}
        export_all: pg_dumpall -U postgres --clean --if-exists
        import_all: psql -U postgres -d postgres
extensions:
  - name: timescaledb
    always: true
