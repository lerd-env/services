name: mariadb
description: MariaDB (MySQL-compatible) versions
family: mariadb
env_role: mysql
default_version: "11.8"
init: true
versions:
  - tag: "12"
    label: "12 (latest)"
    image: docker.io/library/mariadb:12
    host_port: 3306
  - tag: "12.3"
    label: "12.3 LTS"
    image: docker.io/library/mariadb:12.3
    host_port: 3306
  - tag: "11.8"
    label: "11.8 LTS"
    image: docker.io/library/mariadb:11.8
    host_port: 3306
  - tag: "11.4"
    label: "11.4 LTS"
    image: docker.io/library/mariadb:11.4
    host_port: 3306
  - tag: "11"
    label: "11 (legacy)"
    image: docker.io/library/mariadb:11
    host_port: 3306
  - tag: "10.11"
    label: "10.11 LTS"
    image: docker.io/library/mariadb:10.11
    host_port: 3306
ports:
  - "{{host_port}}:3306"
data_dir: /var/lib/mysql
files:
  - target: /etc/mysql/conf.d/lerd.cnf
    content: |
      [mysqld]
      max_allowed_packet=256M
environment:
  MARIADB_ROOT_PASSWORD: lerd
  MARIADB_DATABASE: lerd
env_vars:
  - DB_CONNECTION=mysql
  - DB_HOST=lerd-mariadb-{{tag_safe}}
  - DB_PORT=3306
  - DB_DATABASE=lerd
  - DB_USERNAME=root
  - DB_PASSWORD=lerd
connection_url: mysql://root:lerd@127.0.0.1:{{host_port}}/lerd
client_shims:
  - name: mysql
    binary: [mariadb, mysql]
  - name: mysqldump
    binary: [mariadb-dump, mysqldump]
category: databases
icon: database
# list_databases is kept alongside entities so lerd versions from before the
# entities schema still list the databases.
introspect:
  list_databases: >
    $(command -v mariadb || command -v mysql) -uroot -sN -e
    "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
    FROM information_schema.SCHEMATA s
    LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
    WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
    GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
  entities:
    - kind: databases
      format: sql
      list: >
        $(command -v mariadb || command -v mysql) -uroot -sN -e
        "SELECT s.SCHEMA_NAME, COALESCE(SUM(t.DATA_LENGTH + t.INDEX_LENGTH), 0)
        FROM information_schema.SCHEMATA s
        LEFT JOIN information_schema.TABLES t ON t.TABLE_SCHEMA = s.SCHEMA_NAME
        WHERE s.SCHEMA_NAME NOT IN ('information_schema', 'performance_schema', 'mysql', 'sys')
        GROUP BY s.SCHEMA_NAME ORDER BY s.SCHEMA_NAME"
      columns:
        - key: size
          label: Size
          format: bytes
      actions:
        create: >
          $(command -v mariadb || command -v mysql) -uroot -e
          'CREATE DATABASE IF NOT EXISTS `{{name}}`;'
        drop:
          exec: >
            $(command -v mariadb || command -v mysql) -uroot -e
            'DROP DATABASE IF EXISTS `{{name}}`;'
          destructive: true
        export:
          exec: >
            $(command -v mariadb-dump || command -v mysqldump) -uroot
            --single-transaction --quick --no-tablespaces --routines --triggers --events
            {{name}}
          filename: "{{name}}.sql"
        import: >
          $(command -v mariadb || command -v mysql) --max-allowed-packet=1G -uroot {{name}}
        export_all: >
          $(command -v mariadb-dump || command -v mysqldump) -uroot
          --single-transaction --quick --no-tablespaces --routines --triggers --events
          --add-drop-database --all-databases
        import_all: >
          $(command -v mariadb || command -v mysql) --max-allowed-packet=1G -uroot
