# Schema 2, as understood by lerd 1.36.0 and later.
#
# A schema states only what changed since the one before it, and how to render a
# document back down to that one. Definitions are authored in the newest schema
# under sources/, and CI publishes a rendered tree per schema: the legacy
# unprefixed path is schema 1, which is what every binary up to 1.35.0 computes
# for itself and cannot be taught otherwise.
schema: 2
since_lerd: "1.36.0"

changes:
  # Keys schema 1 has no field for. An old binary ignores them, so dropping is
  # about publishing a tree that means what it says rather than about safety.
  - path: admin_rank
    downgrade: drop
  - path: dashboard_follows_color_scheme
    downgrade: drop
  - path: dashboard_login
    downgrade: drop
  - path: dashboard_proxy_at_path
    downgrade: drop
  - path: dashboard_proxy_keep_host
    downgrade: drop
  - path: dashboard_proxy_rebase
    downgrade: drop
  - path: dashboard_proxy_reroute
    downgrade: drop
  - path: dashboard_proxy_strip
    downgrade: drop
  - path: dashboard_scheme_key
    downgrade: drop

  # This one is not cosmetic. Schema 2 proxies a dashboard at /_svc/<name>/ and
  # strips the upstream's X-Frame-Options and frame-ancestors on the way through.
  # Schema 1 has no such proxy and opens the dashboard URL directly in an iframe,
  # so a UI that refuses framing, which is every upstream needing the strip flag,
  # renders a blocked panel. Better to publish no dashboard to schema 1 than a
  # card that cannot work: the service still installs, runs and serves its port.
  - path: dashboard
    downgrade: drop
    when: dashboard_proxy_strip
