name: kafka
image: docker.io/apache/kafka:4.3.1
description: Apache Kafka event streaming broker
ports:
- 9092:9092
environment:
  KAFKA_NODE_ID: '1'
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://lerd-kafka:9092
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@lerd-kafka:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
  KAFKA_LOG_DIRS: /var/lib/kafka/data
data_dir: /var/lib/kafka/data
userns: keep-id:uid=1000,gid=0
chown_data: true
env_vars:
- KAFKA_BROKERS=lerd-kafka:9092
- KAFKA_HOST=lerd-kafka
- KAFKA_PORT=9092
env_detect:
  key: KAFKA_BROKERS
  composer: mateusjunges/laravel-kafka
connection_url: kafka://127.0.0.1:9092
category: messaging
icon: queue
color: '#231f20'
