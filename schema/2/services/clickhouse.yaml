name: clickhouse
image: docker.io/library/clickhouse:26.3
description: ClickHouse column-oriented analytics database
family: clickhouse
stop_timeout: 60
ports:
- 8123:8123
- 9010:9000
environment:
  CLICKHOUSE_USER: lerd
  CLICKHOUSE_PASSWORD: lerd
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
  CLICKHOUSE_RUN_AS_ROOT: '1'
data_dir: /var/lib/clickhouse
connection_url: http://lerd:lerd@127.0.0.1:8123
env_vars:
- CLICKHOUSE_HOST=lerd-clickhouse
- CLICKHOUSE_PORT=8123
- CLICKHOUSE_USERNAME=lerd
- CLICKHOUSE_PASSWORD=lerd
- CLICKHOUSE_DATABASE={{site}}
dashboard: http://localhost:8123/play?user=lerd&password=lerd
env_detect:
  key: CLICKHOUSE_HOST
  composer: smi2/phpclickhouse
site_init:
  exec: clickhouse-client -q 'CREATE DATABASE IF NOT EXISTS "{{site}}"'
client_shims:
- clickhouse-client
category: databases
icon: database
color: '#ffcc01'
files:
- target: /etc/clickhouse-server/config.d/lerd.xml
  content: "<clickhouse>\n    <listen_host>0.0.0.0</listen_host>\n    <logger>\n \
    \       <level>warning</level>\n    </logger>\n    <!-- A dev box has no use for\
    \ the full telemetry tables, and they grow\n         unbounded; query_log stays\
    \ with a short TTL. -->\n    <metric_log remove=\"1\"/>\n    <asynchronous_metric_log\
    \ remove=\"1\"/>\n    <trace_log remove=\"1\"/>\n    <query_thread_log remove=\"\
    1\"/>\n    <query_log>\n        <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>\n\
    \    </query_log>\n    <max_server_memory_usage_to_ram_ratio>0.4</max_server_memory_usage_to_ram_ratio>\n\
    \    <mark_cache_size>268435456</mark_cache_size>\n    <storage_configuration>\n\
    \        <disks>\n            <backups>\n                <type>local</type>\n\
    \                <path>/var/lib/clickhouse/backups/</path>\n            </backups>\n\
    \        </disks>\n    </storage_configuration>\n    <backups>\n        <allowed_disk>backups</allowed_disk>\n\
    \        <allowed_path>/var/lib/clickhouse/backups/</allowed_path>\n    </backups>\n\
    </clickhouse>\n"
- target: /etc/clickhouse-client/config.xml
  content: "<clickhouse>\n    <user>lerd</user>\n    <password>lerd</password>\n</clickhouse>\n"
introspect:
  list_databases: 'clickhouse-client -q "SELECT d.name, ifNull(s.bytes, 0) FROM system.databases
    AS d LEFT JOIN (SELECT database, sum(bytes_on_disk) AS bytes FROM system.parts
    WHERE active GROUP BY database) AS s ON s.database = d.name WHERE d.name NOT IN
    (''system'', ''INFORMATION_SCHEMA'', ''information_schema'') ORDER BY d.name"

    '
  entities:
  - kind: databases
    list: 'clickhouse-client -q "SELECT d.name, ifNull(s.bytes, 0) FROM system.databases
      AS d LEFT JOIN (SELECT database, sum(bytes_on_disk) AS bytes FROM system.parts
      WHERE active GROUP BY database) AS s ON s.database = d.name WHERE d.name NOT
      IN (''system'', ''INFORMATION_SCHEMA'', ''information_schema'') ORDER BY d.name"

      '
    columns:
    - key: size
      label: Size
      format: bytes
    actions:
      create: clickhouse-client -q 'CREATE DATABASE IF NOT EXISTS "{{name}}"'
      drop:
        exec: clickhouse-client -q 'DROP DATABASE IF EXISTS "{{name}}"'
        destructive: true
      export:
        exec: 'clickhouse-client -q "BACKUP DATABASE \"{{name}}\" TO Disk(''backups'',
          ''{{name}}.zip'')" >/dev/null && cat /var/lib/clickhouse/backups/{{name}}.zip
          && rm -f /var/lib/clickhouse/backups/{{name}}.zip

          '
        filename: '{{name}}.zip'
      import: 'cat > /var/lib/clickhouse/backups/{{name}}.zip && clickhouse-client
        -q "DROP DATABASE IF EXISTS \"{{name}}\"" >/dev/null && clickhouse-client
        -q "RESTORE DATABASE \"{{name}}\" FROM Disk(''backups'', ''{{name}}.zip'')"
        >/dev/null && rm -f /var/lib/clickhouse/backups/{{name}}.zip

        '
