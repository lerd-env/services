name: localstack
image: docker.io/localstack/localstack:4.14
update_strategy: patch
description: LocalStack, the AWS APIs (SQS, SES, DynamoDB, Secrets Manager) run locally
ports:
- 4566:4566
environment:
  DEBUG: '0'
data_dir: /var/lib/localstack
env_vars:
- AWS_ACCESS_KEY_ID=lerd
- AWS_SECRET_ACCESS_KEY=lerdpassword
- AWS_DEFAULT_REGION=us-east-1
- SQS_PREFIX=http://lerd-localstack:4566/000000000000
- SQS_QUEUE=default
- AWS_ENDPOINT_URL=http://lerd-localstack:4566
category: testing
icon: cube
color: '#4b4ed2'
